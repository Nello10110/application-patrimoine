# Déploiement sur le homelab distant à partir des images DÉJÀ CONSTRUITES par la CI
# (`.github/workflows/docker-publish.yml`, publiées sur ghcr.io à chaque push sur
# main) — jamais de build sur cette machine. Voir docs/MANUEL_EXPLOITATION.md
# § « Images pré-construites (CI GitHub Actions) » pour le mode d'emploi complet
# (génération des clés, connexion au registre privé...).
#
#   docker login ghcr.io -u <utilisateur> -p <jeton d'accès personnel, read:packages>
#   docker compose -f compose-homelab.yaml pull
#   docker compose -f compose-homelab.yaml up -d
#
# Ports liés à 0.0.0.0 (pas 127.0.0.1 comme compose-exemple.yaml) : joignable
# depuis n'importe quel appareil du réseau local (ex. http://192.168.x.x:8080),
# choix assumé pour un usage quotidien. Reste néanmoins injoignable depuis
# internet tant que le routeur/pare-feu du homelab ne redirige pas ces ports —
# une décision qui reste entièrement à la charge de l'exploitant, jamais faite
# par ce fichier.

services:
  backend:
    image: ghcr.io/nello10110/application-patrimoine-backend:latest
    environment:
      PATRIMOINE_DB: /app/data/patrimoine.db
      # Lues depuis un fichier `.env` place a cote de ce compose (ignore par git),
      # JAMAIS ecrites ici : ce fichier est versionne et pousse sur le depot
      # distant. Voir `.env.exemple` pour le gabarit et les commandes de
      # generation. Perdre cette cle rend les sauvegardes chiffrees irrecuperables.
      PATRIMOINE_BACKUP_KEY: ${PATRIMOINE_BACKUP_KEY:?definir PATRIMOINE_BACKUP_KEY dans .env}
      # Connexion SSO/OIDC (facultative, revue du 04/09/2026) -- laisser
      # PATRIMOINE_OIDC_ENABLED a "false" (ou absente de .env) desactive le bouton
      # de connexion sans erreur. Voir docs/MANUEL_EXPLOITATION.md section 12.1.
      PATRIMOINE_OIDC_ENABLED: ${PATRIMOINE_OIDC_ENABLED:-false}
      PATRIMOINE_OIDC_ISSUER: ${PATRIMOINE_OIDC_ISSUER:-}
      PATRIMOINE_OIDC_CLIENT_ID: ${PATRIMOINE_OIDC_CLIENT_ID:-}
      PATRIMOINE_OIDC_CLIENT_SECRET: ${PATRIMOINE_OIDC_CLIENT_SECRET:-}
      PATRIMOINE_OIDC_REDIRECT_URI: ${PATRIMOINE_OIDC_REDIRECT_URI:-}
      PATRIMOINE_OIDC_FRONTEND_URL: ${PATRIMOINE_OIDC_FRONTEND_URL:-}
      PATRIMOINE_OIDC_DISPLAY_NAME: ${PATRIMOINE_OIDC_DISPLAY_NAME:-}
      PATRIMOINE_OIDC_CLAIM_USERNAME: ${PATRIMOINE_OIDC_CLAIM_USERNAME:-}
      PATRIMOINE_OIDC_CLAIM_EMAIL: ${PATRIMOINE_OIDC_CLAIM_EMAIL:-}
      PATRIMOINE_OIDC_CLAIM_NOM: ${PATRIMOINE_OIDC_CLAIM_NOM:-}
    volumes:
      - patrimoine_data:/app/data
      - patrimoine_sauvegardes:/app/sauvegardes
    ports:
      - "8000:8000"
    restart: unless-stopped

  frontend:
    image: ghcr.io/nello10110/application-patrimoine-frontend:latest
    depends_on:
      - backend
    ports:
      - "8080:80"
    restart: unless-stopped

volumes:
  patrimoine_data:
  patrimoine_sauvegardes:
