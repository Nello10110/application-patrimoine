# Exemple de déploiement Docker Compose pour un homelab — voir
# docs/MANUEL_EXPLOITATION.md § « Déploiement Docker (homelab) » pour le mode d'emploi
# complet (génération des clés, ce que couvrent les volumes...).
#
# Copier ce fichier en `compose.yaml` (ou le référencer avec `-f`), poser un `.env` à
# côté (cf. `.env.exemple`) avec une vraie clé PATRIMOINE_BACKUP_KEY générée, puis :
#   docker compose -f compose-exemple.yaml up --build
#
# IMPORTANT — pas exposé au public pour l'instant : les deux ports publiés sont liés à
# 127.0.0.1 sur l'hôte, jamais 0.0.0.0. L'application reste donc injoignable depuis le
# reste du LAN ou internet tant qu'aucun reverse proxy n'est ajouté volontairement
# devant (cf. la section SSO/Authentik du manuel d'exploitation pour quand ce jour
# viendra). Ne changer ces valeurs qu'en connaissance de cause.

services:
  backend:
    build: ./backend
    environment:
      PATRIMOINE_DB: /app/data/patrimoine.db
      # Lues depuis un fichier `.env` place a cote de ce compose (ignore par git),
      # JAMAIS ecrites ici : ce fichier est versionne et pousse sur le depot
      # distant. Voir `.env.exemple` pour le gabarit et les commandes de
      # generation. Perdre cette cle rend les sauvegardes chiffrees irrecuperables.
      PATRIMOINE_BACKUP_KEY: ${PATRIMOINE_BACKUP_KEY:?definir PATRIMOINE_BACKUP_KEY dans .env}
      # Connexion SSO/OIDC (facultative) -- laisser PATRIMOINE_OIDC_ENABLED a
      # "false" (ou absente de .env) desactive le bouton de connexion sans erreur.
      # Voir docs/MANUEL_EXPLOITATION.md section 12.1.
      PATRIMOINE_OIDC_ENABLED: ${PATRIMOINE_OIDC_ENABLED:-false}
      PATRIMOINE_OIDC_ISSUER: ${PATRIMOINE_OIDC_ISSUER:-}
      PATRIMOINE_OIDC_CLIENT_ID: ${PATRIMOINE_OIDC_CLIENT_ID:-}
      PATRIMOINE_OIDC_CLIENT_SECRET: ${PATRIMOINE_OIDC_CLIENT_SECRET:-}
      PATRIMOINE_OIDC_REDIRECT_URI: ${PATRIMOINE_OIDC_REDIRECT_URI:-}
      PATRIMOINE_OIDC_FRONTEND_URL: ${PATRIMOINE_OIDC_FRONTEND_URL:-}
      PATRIMOINE_OIDC_DISPLAY_NAME: ${PATRIMOINE_OIDC_DISPLAY_NAME:-}
      PATRIMOINE_OIDC_CLAIM_USERNAME: ${PATRIMOINE_OIDC_CLAIM_USERNAME:-}
      PATRIMOINE_OIDC_CLAIM_EMAIL: ${PATRIMOINE_OIDC_CLAIM_EMAIL:-}
      PATRIMOINE_OIDC_CLAIM_NOM: ${PATRIMOINE_OIDC_CLAIM_NOM:-}
    volumes:
      - patrimoine_data:/app/data
      - patrimoine_sauvegardes:/app/sauvegardes
    ports:
      - "127.0.0.1:8000:8000"
    restart: unless-stopped

  frontend:
    build: ./frontend
    depends_on:
      - backend
    ports:
      - "127.0.0.1:8080:80"
    restart: unless-stopped

volumes:
  patrimoine_data:
  patrimoine_sauvegardes:
