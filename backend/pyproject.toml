[tool.ruff]
# 140 : au-dessus du 99e centile réel du code existant (p99 ≈ 124) — attrape les
# vraies lignes hors de contrôle sans forcer une reformatation de masse des
# docstrings/commentaires longs, déjà la norme de ce projet.
line-length = 140
target-version = "py312"

[tool.ruff.lint]
select = ["E", "W", "F", "I", "UP", "B", "SIM", "C4", "ARG"]
ignore = [
    # FastAPI : `Depends(...)` en valeur par défaut est le patron idiomatique
    # d'injection de dépendances du framework, pas un bug d'argument mutable.
    "B008",
    # La fusion suggérée (`A and B or C and D`) est correcte (priorité de `and`
    # sur `or`) mais moins lisible qu'un elif par catégorie de transaction pour
    # ce code métier — un branchement explicite par cas vaut mieux ici qu'une
    # expression booléenne dense à re-décortiquer.
    "SIM114",
]

[tool.ruff.lint.per-file-ignores]
# Un paramètre de dépendance FastAPI non utilisé dans le corps (ex.
# `current_user: User = Depends(require_role(...))`) est un GARDE-FOU
# d'autorisation, pas du code mort — le retirer réintroduirait une faille.
"app/routers/*.py" = ["ARG001"]
"app/main.py" = ["ARG001"]
