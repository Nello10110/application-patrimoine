# Configuration Alembic (backlog 2.I.4) : remplace les migrations maison de
# `app/database.py`. `sqlalchemy.url` ci-dessous n'est qu'un placeholder — la
# vraie URL (résolution dynamique du chemin de base, cf. `app.database.DATABASE_URL`)
# est posée par `alembic/env.py`, pour rester cohérente avec l'application et les
# tests (variable d'environnement `PATRIMOINE_DB`).

[alembic]
script_location = %(here)s/alembic
prepend_sys_path = .
path_separator = os

sqlalchemy.url = driver://user:pass@localhost/dbname


[post_write_hooks]
# Pas de hook de formatage/lint automatique sur les scripts de révision générés :
# `oxlint`/le reste de la chaîne qualité de ce projet ne couvre pas Python, les
# scripts générés sont relus à la main comme tout le reste du backend.
